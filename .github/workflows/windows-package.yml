name: Windows runtime package

on:
  push:
    branches:
      - windows/pc-runtime-package
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Build and package Windows x64 runtime
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check repository asset policy
        run: cargo xtask policy
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Build release executable
        run: cargo build --release -p victory --locked
      - name: Create portable runtime ZIP
        run: .\scripts\Build-Windows-Package.ps1 -SkipTests
      - name: Verify ZIP and write checksum
        shell: pwsh
        run: |
          $zip = 'out/VIctory-Windows-x64.zip'
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Package ZIP is missing: $zip" }
          Get-FileHash -LiteralPath $zip -Algorithm SHA256 | Format-List | Out-File 'out/VIctory-Windows-x64.SHA256.txt' -Encoding utf8
      - name: Upload Windows runtime package
        uses: actions/upload-artifact@v4
        with:
          name: VIctory-Windows-x64-${{ github.sha }}
          path: |
            out/VIctory-Windows-x64.zip
            out/VIctory-Windows-x64.SHA256.txt
          if-no-files-found: error
          retention-days: 14
